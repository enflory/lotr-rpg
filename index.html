<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + viewport-fit keep pinch-zoom and double-tap zoom
         from fighting the on-screen controls on phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a12" />
    <title>The Lord of the Rings RPG</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23c8a84e' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #0a0a12;
        display: flex;
        justify-content: center;
        align-items: center;
        /* dvh tracks the collapsing browser chrome on mobile; vh is the
           fallback for browsers without dynamic viewport units */
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: 'Press Start 2P', monospace;
        /* no rubber-band scroll, no text selection from a mistimed drag */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Portrait phones: pin the game to the top so the whole lower
         letterbox band belongs to the controls instead of half of it
         sitting under the pad. */
      @media (orientation: portrait) {
        body.has-touch-controls {
          align-items: flex-start;
          /* keep the view clear of a notch / status bar */
          padding-top: env(safe-area-inset-top);
        }
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* swipes on the game view move the character, not the page */
        touch-action: none;
      }

      /* ── touch controls (built by src/input/touchControls.js) ───────
         Fixed to the viewport, not the canvas: on a portrait phone the
         4:3 canvas leaves letterbox bands the controls can live in, and
         in landscape they float over the corners at low opacity. */
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none; /* only the widgets themselves take input */
        touch-action: none;
      }
      #touch-controls > * {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
      }
      #touch-pad {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(20, 20, 32, 0.45);
        border: 2px solid rgba(200, 168, 78, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #touch-knob {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(200, 168, 78, 0.55);
        border: 2px solid rgba(240, 234, 214, 0.7);
        transition: transform 60ms linear;
      }
      #touch-actions {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
      }
      /* Tall viewports keep the game pinned to the top, so the menu row
         sits in the empty band beside the pad. */
      #touch-menus {
        left: 50%;
        transform: translateX(-50%);
        /* clear of the 132px pad and the action button below it */
        bottom: calc(max(16px, env(safe-area-inset-bottom)) + 148px);
        display: flex;
        gap: 14px;
      }
      .touch-btn {
        font-family: inherit;
        color: #f0ead6;
        background: rgba(20, 20, 32, 0.55);
        border: 2px solid rgba(200, 168, 78, 0.65);
        border-radius: 50%;
        line-height: 1;
      }
      .touch-btn-action {
        width: 88px;
        height: 88px;
        font-size: 26px;
      }
      .touch-btn-small {
        width: 44px;
        height: 44px;
        font-size: 13px;
      }
      .touch-btn.is-pressed {
        background: rgba(200, 168, 78, 0.75);
        color: #14141f;
      }

      /* Short viewports (landscape phones) have no letterbox to spare, so
         shrink the widgets and fade them over the game view. */
      @media (max-height: 480px) {
        /* No band to spare — park the menu row in the top corner, away
           from the dialogue box along the bottom of the view. */
        #touch-menus {
          left: auto;
          transform: none;
          right: max(12px, env(safe-area-inset-right));
          top: max(12px, env(safe-area-inset-top));
          bottom: auto;
        }
        #touch-pad {
          width: 104px;
          height: 104px;
          opacity: 0.62;
        }
        #touch-knob {
          width: 44px;
          height: 44px;
        }
        .touch-btn-action {
          width: 72px;
          height: 72px;
          font-size: 22px;
          opacity: 0.62;
        }
        .touch-btn-small {
          width: 38px;
          height: 38px;
          font-size: 11px;
          opacity: 0.62;
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
