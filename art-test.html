<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Art Test — procedural sprite/tile preview</title>
  <style>
    body { background: #2a2a30; color: #eee; font-family: monospace; padding: 16px; }
    img { image-rendering: pixelated; display: block; background: #55585f; margin: 4px 0 20px; }
    h3 { margin: 0; font-size: 13px; color: #c8a84e; }
  </style>
</head>
<body>
  <script type="module">
    import { makeTilesetDataURL } from '/src/art/tiles.js';
    import { CHAR_NAMES, makeCharSheet } from '/src/art/characters.js';

    const add = (title, url, scale) => {
      const h = document.createElement('h3');
      h.textContent = title;
      const img = new Image();
      img.src = url;
      img.onload = () => { img.style.width = img.naturalWidth * scale + 'px'; };
      document.body.append(h, img);
    };

    add('tileset', makeTilesetDataURL(), 4);
    for (const name of CHAR_NAMES) add(name, makeCharSheet(name), 5);
    document.title = 'Art Test — OK';
  </script>
</body>
</html>
